<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>孵化新宠物 · Perchy</title>
  <style>
    :root {
      --bg: #f6f4f1; --panel: #ffffff; --ink: #2a2622; --muted: #8a8279; --line: #e7e2dc;
      --accent: #e98b3a; --accent-ink: #fff; --ok: #3b9b5d; --warn: #c98a12; --bad: #c8453b;
      --checker-a: #efebe6; --checker-b: #e3ddd6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1a18; --panel: #262320; --ink: #eee8e1; --muted: #9b9288; --line: #38332e;
        --accent: #f0a05a; --accent-ink: #1c1a18; --checker-a: #2d2a26; --checker-b: #34302b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { display: grid; grid-template-columns: 330px 1fr; height: 100vh; }
    aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 16px 24px; background: var(--panel); }
    section.work { overflow-y: auto; padding: 18px 22px 40px; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    h2 { font-size: 13px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
    p.hint { color: var(--muted); margin: 4px 0 0; font-size: 12px; }
    label { display: block; margin: 10px 0 4px; font-weight: 500; }
    input[type=text], input[type=password], select, textarea {
      width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px;
      background: var(--bg); color: var(--ink); font: inherit;
    }
    textarea { min-height: 64px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .check { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-weight: 400; }
    button {
      font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--panel); color: var(--ink); cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    button.small { padding: 3px 9px; font-size: 12px; }
    .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--bg); }
    .status { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 6px; white-space: pre-wrap; }
    .status.bad { color: var(--bad); } .status.ok { color: var(--ok); }
    #drop {
      border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px; text-align: center; color: var(--muted);
      cursor: pointer; margin-top: 6px;
    }
    #drop.has { padding: 6px; }
    #drop img { max-width: 100%; max-height: 160px; display: block; margin: 0 auto; border-radius: 6px; }
    .checker {
      background-color: var(--checker-a);
      background-image: linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%),
        linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%);
      background-size: 16px 16px; background-position: 0 0, 8px 8px; border-radius: 8px;
    }
    .base { display: flex; gap: 16px; align-items: flex-start; }
    .base .raw { width: 220px; border-radius: 8px; border: 1px solid var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 10px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .card header { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .card header b { font-size: 13px; }
    .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
    .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.run { color: var(--accent); }
    .card canvas.anim { width: 96px; height: 104px; display: block; margin: 8px auto 4px; }
    .card .warn { color: var(--warn); font-size: 11.5px; min-height: 16px; }
    .card .bad { color: var(--bad); font-size: 11.5px; }
    .card details { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .card details img { width: 100%; border-radius: 6px; margin-top: 4px; }
    .final { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
    #atlas { width: 384px; max-width: 100%; height: auto; border: 1px solid var(--line); }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; } }
  </style>
</head>
<body>
<main>
  <aside>
    <h1>孵化新宠物</h1>
    <p class="hint">用 AI 把一张图或一段描述变成一整套会动的桌宠（Codex v2 格式）。</p>

    <h2>AI 接口</h2>
    <div class="row">
      <select id="profile"></select>
      <button class="small" id="newProfile" style="flex:none">新建</button>
    </div>
    <div class="box" id="profileForm">
      <label for="pName">名称</label>
      <input type="text" id="pName" placeholder="例如：OpenAI 官方" />
      <label for="pProtocol">协议</label>
      <select id="pProtocol">
        <option value="images">OpenAI Images（/images/edits）</option>
        <option value="chat">OpenAI Chat 输出图片（/chat/completions）</option>
      </select>
      <label for="pUrl">API 地址</label>
      <input type="text" id="pUrl" placeholder="https://api.openai.com/v1" />
      <label for="pModel">模型</label>
      <input type="text" id="pModel" placeholder="gpt-image-2" />
      <label for="pKey">API key</label>
      <input type="password" id="pKey" placeholder="sk-…" autocomplete="off" />
      <div id="imagesOpts">
        <label for="pQuality">质量</label>
        <select id="pQuality">
          <option value="">不指定</option><option value="low">low（便宜）</option>
          <option value="medium">medium</option><option value="high">high</option><option value="auto">auto</option>
        </select>
        <label class="check"><input type="checkbox" id="pTransparent" /> 请求透明背景（接口支持时更干净）</label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="saveProfile">保存</button>
        <button id="testProfile">测试连接</button>
        <button id="deleteProfile">删除</button>
      </div>
      <div class="status" id="profileStatus"></div>
      <p class="hint">API key 只保存在系统钥匙串里。</p>
    </div>

    <h2>宠物</h2>
    <label for="petName">名字</label>
    <input type="text" id="petName" placeholder="例如：橘子" />
    <label for="petDesc">描述</label>
    <textarea id="petDesc" placeholder="外观和性格，例如：圆滚滚的橘色短毛猫，戴红色小围巾，元气满满"></textarea>
    <label>参考图（可选）</label>
    <div id="drop">点击选择或拖入一张图片</div>
    <input type="file" id="file" accept="image/*" hidden />
    <label for="style">风格</label>
    <select id="style">
      <option value="auto">跟随参考图 / 描述</option>
      <option value="chibi">Q 版二次元</option>
      <option value="pixel">像素风</option>
      <option value="plush">毛绒玩具</option>
      <option value="clay">黏土</option>
      <option value="toy3d">3D 玩具</option>
      <option value="flat">扁平矢量</option>
    </select>
    <label class="check"><input type="checkbox" id="withLook" checked /> 生成 16 个看向方向（眼睛跟着鼠标转）</label>
    <div class="box" id="estimate"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="genBase">① 生成形象</button>
    </div>
    <div class="status" id="mainStatus"></div>
  </aside>

  <section class="work">
    <div id="baseArea" class="empty">先在左边填好 AI 接口和宠物信息，然后点「生成形象」。</div>
    <div id="rowsArea" hidden>
      <h2>动作</h2>
      <div class="row" style="justify-content:flex-start; gap:8px">
        <button class="primary" id="genAll" style="flex:none">② 生成全部动作</button>
        <span class="status" id="rowsStatus" style="margin:0"></span>
      </div>
      <div class="grid" id="cards"></div>
    </div>
    <div id="finalArea" hidden>
      <h2>完成</h2>
      <div class="final">
        <canvas id="atlas" class="checker" width="1536" height="2288"></canvas>
        <div style="flex:1; min-width:220px">
          <label for="petId">ID（文件夹名，字母数字 - _）</label>
          <input type="text" id="petId" />
          <div class="row" style="margin-top:12px">
            <button class="primary" id="install">③ 安装到桌面</button>
          </div>
          <div class="status" id="installStatus"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="hatch-pipeline.js"></script>
<script src="hatch.js"></script>
</body>
</html>
