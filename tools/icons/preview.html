<!doctype html>
<meta charset="utf-8">
<title>Coquou icon concepts</title>
<style>
  body { margin: 0; padding: 32px 40px; background: #f4f2ef; font: 15px/1.5 -apple-system, "PingFang SC", sans-serif; color: #2a2622; width: 1520px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .sub { color: #8a8279; margin-bottom: 26px; }
  .row { display: grid; grid-template-columns: 220px 230px 1fr 250px; gap: 26px; align-items: center; background: #fff; border-radius: 18px; padding: 18px 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .big img { width: 210px; height: 210px; display: block; }
  .name { font-size: 20px; font-weight: 700; }
  .note { color: #6b635b; font-size: 14px; margin-top: 6px; }
  .sizes { display: flex; gap: 18px; align-items: flex-end; }
  .sizes .bg { padding: 14px; border-radius: 12px; display: flex; gap: 16px; align-items: flex-end; }
  .sizes .light { background: #e9e6e2; } .sizes .dark { background: #1f1e1d; }
  .menubar { border-radius: 8px; height: 30px; display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 13px; margin: 6px 0; }
  .menubar.light { background: rgba(240,238,235,.95); color: #222; }
  .menubar.dark { background: #2b2a29; color: #eee; }
  .menubar .glyph { width: 18px; height: 18px; }
  .menubar.dark .glyph { filter: invert(1); }
  .label { font-size: 11px; color: #8a8279; text-align: center; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 4px; }
</style>
<h1>Coquou 应用图标方案</h1>
<div class="sub">每行：大图 · 名称说明 · 实际尺寸（浅色 / 深色背景）· 菜单栏图标（单色，浅色 / 深色菜单栏）</div>
<div id="rows"></div>
<script src="icons.js"></script>
<script>
  const url = (svg) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  const only = new URLSearchParams(location.search).get("only");
  for (const c of ICONS.filter((c) => !only || c.id.startsWith(only))) {
    const sizes = [128, 64, 32, 16].map((s) => `<div class="stack"><img src="${url(c.icon)}" width="${s}" height="${s}"><div class="label">${s}</div></div>`).join("");
    document.getElementById("rows").insertAdjacentHTML("beforeend", `
      <div class="row">
        <div class="big"><img src="${url(c.icon)}"></div>
        <div><div class="name">${c.name}</div><div class="note">${c.note}</div></div>
        <div class="sizes"><div class="bg light">${sizes}</div><div class="bg dark">${sizes}</div></div>
        <div>
          <div class="menubar light"><span>Wi-Fi</span><img class="glyph" src="${url(c.tray)}"><span>周五 16:40</span></div>
          <div class="menubar dark"><span>Wi-Fi</span><img class="glyph" src="${url(c.tray)}"><span>周五 16:40</span></div>
        </div>
      </div>`);
  }
</script>
